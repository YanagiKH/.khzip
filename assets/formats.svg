<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">.khzip format comparison</title><desc id="d">Five cards compare khz, khpak, khx, khaz, and khcz formats.</desc><rect width="1200" height="560" rx="28" fill="#0b1020"/><text x="54" y="70" fill="#f5f7ff" font-family="Arial" font-size="38" font-weight="700">Choose the security and delivery model</text>
<g font-family="Arial"><g transform="translate(50 110)"><rect width="210" height="380" rx="18" fill="#171f35" stroke="#665cf6" stroke-width="3"/><text x="25" y="58" fill="#fff" font-size="30" font-weight="700">.khz</text><text x="25" y="94" fill="#9faac8" font-size="17">General archive</text><text x="25" y="145" fill="#dce2f7" font-size="17">• Optional password</text><text x="25" y="181" fill="#dce2f7" font-size="17">• All modes</text><text x="25" y="217" fill="#dce2f7" font-size="17">• Sharing / backup</text></g>
<g transform="translate(275 110)"><rect width="210" height="380" rx="18" fill="#171f35" stroke="#65708f" stroke-width="3"/><text x="25" y="58" fill="#fff" font-size="30" font-weight="700">.khpak</text><text x="25" y="94" fill="#9faac8" font-size="17">Asset package</text><text x="25" y="145" fill="#dce2f7" font-size="17">• No encryption</text><text x="25" y="181" fill="#dce2f7" font-size="17">• Random access</text><text x="25" y="217" fill="#dce2f7" font-size="17">• Games / software</text></g>
<g transform="translate(500 110)"><rect width="210" height="380" rx="18" fill="#171f35" stroke="#19b5a5" stroke-width="3"/><text x="25" y="58" fill="#fff" font-size="30" font-weight="700">.khx</text><text x="25" y="94" fill="#9faac8" font-size="17">Split transport</text><text x="25" y="145" fill="#dce2f7" font-size="17">• Numbered parts</text><text x="25" y="181" fill="#dce2f7" font-size="17">• Optional password</text><text x="25" y="217" fill="#dce2f7" font-size="17">• Size-limited media</text></g>
<g transform="translate(725 110)"><rect width="210" height="380" rx="18" fill="#171f35" stroke="#f2a65a" stroke-width="3"/><text x="25" y="58" fill="#fff" font-size="30" font-weight="700">.khaz</text><text x="25" y="94" fill="#9faac8" font-size="17">Extreme encrypted</text><text x="25" y="145" fill="#dce2f7" font-size="17">• Password required</text><text x="25" y="181" fill="#dce2f7" font-size="17">• Two AEAD layers</text><text x="25" y="217" fill="#dce2f7" font-size="17">• Extreme mode</text></g>
<g transform="translate(950 110)"><rect width="210" height="380" rx="18" fill="#171f35" stroke="#ec6f91" stroke-width="3"/><text x="25" y="58" fill="#fff" font-size="30" font-weight="700">.khcz</text><text x="25" y="94" fill="#9faac8" font-size="17">Device bound</text><text x="25" y="145" fill="#dce2f7" font-size="17">• Local device key</text><text x="25" y="181" fill="#dce2f7" font-size="17">• Extreme mode</text><text x="25" y="217" fill="#dce2f7" font-size="17">• Cloud backup</text></g></g></svg>
