<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">.khzip processing workflow</title><desc id="d">Files flow through safe collection, content-defined chunking, deduplication, compression, encryption, indexing, and verification.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7e89a8"/></marker></defs><rect width="1200" height="500" rx="28" fill="#0b1020"/><text x="50" y="68" fill="#f5f7ff" font-family="Arial" font-size="36" font-weight="700">Authenticated archive pipeline</text>
<g font-family="Arial" text-anchor="middle"><g transform="translate(40 135)"><rect width="155" height="145" rx="16" fill="#171f35" stroke="#53607f"/><text x="77" y="58" fill="#fff" font-size="20" font-weight="700">Collect</text><text x="77" y="90" fill="#aab5d3" font-size="15">Reject symlinks</text><text x="77" y="115" fill="#aab5d3" font-size="15">Normalize paths</text></g><g transform="translate(235 135)"><rect width="155" height="145" rx="16" fill="#171f35" stroke="#19b5a5"/><text x="77" y="58" fill="#fff" font-size="20" font-weight="700">FastCDC</text><text x="77" y="90" fill="#aab5d3" font-size="15">Streaming chunks</text><text x="77" y="115" fill="#aab5d3" font-size="15">Bounded memory</text></g><g transform="translate(430 135)"><rect width="155" height="145" rx="16" fill="#171f35" stroke="#19b5a5"/><text x="77" y="58" fill="#fff" font-size="20" font-weight="700">BLAKE3</text><text x="77" y="90" fill="#aab5d3" font-size="15">Chunk identity</text><text x="77" y="115" fill="#aab5d3" font-size="15">Deduplicate</text></g><g transform="translate(625 135)"><rect width="155" height="145" rx="16" fill="#171f35" stroke="#665cf6"/><text x="77" y="58" fill="#fff" font-size="20" font-weight="700">Compress</text><text x="77" y="90" fill="#aab5d3" font-size="15">Zstd / Brotli</text><text x="77" y="115" fill="#aab5d3" font-size="15">LZMA2</text></g><g transform="translate(820 135)"><rect width="155" height="145" rx="16" fill="#171f35" stroke="#f2a65a"/><text x="77" y="58" fill="#fff" font-size="20" font-weight="700">Encrypt</text><text x="77" y="90" fill="#aab5d3" font-size="15">Argon2id</text><text x="77" y="115" fill="#aab5d3" font-size="15">XChaCha20</text></g><g transform="translate(1015 135)"><rect width="145" height="145" rx="16" fill="#171f35" stroke="#ec6f91"/><text x="72" y="58" fill="#fff" font-size="20" font-weight="700">Index</text><text x="72" y="90" fill="#aab5d3" font-size="15">Encrypted</text><text x="72" y="115" fill="#aab5d3" font-size="15">Merkle root</text></g></g>
<g stroke="#7e89a8" stroke-width="3" marker-end="url(#a)"><path d="M195 207h32"/><path d="M390 207h32"/><path d="M585 207h32"/><path d="M780 207h32"/><path d="M975 207h32"/></g><rect x="180" y="350" width="840" height="80" rx="16" fill="#11192d" stroke="#3b4667"/><text x="600" y="383" fill="#fff" font-family="Arial" font-size="20" text-anchor="middle" font-weight="700">Verify before trust</text><text x="600" y="412" fill="#aab5d3" font-family="Arial" font-size="16" text-anchor="middle">Trailer checksum → record authentication → decompression length → chunk hash → Merkle root</text></svg>
