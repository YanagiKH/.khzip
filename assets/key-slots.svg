<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">.khzip version 2 key-slot architecture</title>
  <desc id="desc">Passwords and three public-key algorithms wrap one random archive master key, which encrypts authenticated chunk and manifest records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#122640"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e3c2"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="34" font-weight="700">One archive key. Several recovery paths.</text>
  <text x="64" y="104" fill="#9fb3cc" font-family="system-ui,sans-serif" font-size="18">Container v2 authenticates the key-slot directory with every encrypted record.</text>
  <g font-family="system-ui,sans-serif" font-size="18" filter="url(#shadow)">
    <g transform="translate(64 155)">
      <rect width="240" height="62" rx="15" fill="#182f4d" stroke="#38597d"/><text x="22" y="39" fill="#e9f1fb">Password + Argon2id</text>
      <rect y="78" width="240" height="62" rx="15" fill="#182f4d" stroke="#38597d"/><text x="22" y="117" fill="#e9f1fb">X25519 / HPKE</text>
      <rect y="156" width="240" height="62" rx="15" fill="#182f4d" stroke="#38597d"/><text x="22" y="195" fill="#e9f1fb">ML-KEM-768</text>
      <rect y="234" width="240" height="62" rx="15" fill="#182f4d" stroke="#57e3c2"/><text x="22" y="273" fill="#e9f1fb">X-Wing hybrid</text>
    </g>
    <path d="M330 186 C400 186 420 280 486 280 M330 264 C400 264 420 280 486 280 M330 342 C400 342 420 280 486 280 M330 420 C400 420 420 280 486 280" fill="none" stroke="#6aa8ff" stroke-width="4" opacity=".8"/>
    <g transform="translate(486 220)">
      <rect width="250" height="120" rx="24" fill="url(#key)"/>
      <text x="125" y="51" text-anchor="middle" fill="#07111f" font-size="18" font-weight="700">Random 256-bit</text>
      <text x="125" y="79" text-anchor="middle" fill="#07111f" font-size="18" font-weight="700">archive master key</text>
    </g>
    <path d="M736 280 H825" stroke="#57e3c2" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(825 150)">
      <rect width="310" height="260" rx="24" fill="#0e2037" stroke="#38597d"/>
      <text x="28" y="50" fill="#f4f8ff" font-size="22" font-weight="700">Authenticated records</text>
      <rect x="28" y="78" width="254" height="48" rx="12" fill="#182f4d"/><text x="48" y="109" fill="#cfe0f2">Deduplicated chunks</text>
      <rect x="28" y="140" width="254" height="48" rx="12" fill="#182f4d"/><text x="48" y="171" fill="#cfe0f2">Encrypted manifest</text>
      <rect x="28" y="202" width="254" height="32" rx="10" fill="#173b47"/><text x="48" y="224" fill="#75e6ca" font-size="15">XChaCha20-Poly1305</text>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#57e3c2"/></marker></defs>
</svg>
