name: Bootstrap v2 source

on:
  push:
    branches: [work/khzip-v2-product]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/khzip-v2-product
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore source bundle
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/khzip-v2.tar.xz
          tar -xJf /tmp/khzip-v2.tar.xz -C .
          cargo fmt --all
          cargo generate-lockfile
          rm -rf .bootstrap
      - name: Commit source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/bootstrap-v2.yml
          git commit -m "Implement container v2 and product design"
          git push origin HEAD:work/khzip-v2-product
      - name: Compile and test
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
