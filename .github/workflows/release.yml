name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --features gui --bin khzip-gui
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="khzip-${VERSION}-${{ matrix.label }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/khzip" "$NAME/"
          cp "target/${{ matrix.target }}/release/khzip-gui" "$NAME/"
          tar -czf "$NAME.tar.gz" -C "$NAME" .
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart("v")
          $Name = "khzip-$Version-${{ matrix.label }}"
          New-Item -ItemType Directory $Name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/khzip.exe" $Name
          Copy-Item "target/${{ matrix.target }}/release/khzip-gui.exe" $Name
          Compress-Archive "$Name/*" "$Name.zip"
          $Hash = (Get-FileHash "$Name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Name.zip" | Set-Content "$Name.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            khzip-*.tar.gz
            khzip-*.tar.gz.sha256
            khzip-*.zip
            khzip-*.zip.sha256
