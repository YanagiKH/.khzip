name: Normalize Source

on:
  push:
    branches: [agent/secure-khzip-mvp]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-khzip-mvp
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Make CI formatting read-only
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = text.replace(
              '      - name: Normalize formatting for verification\n        run: cargo fmt --all\n',
              '      - name: Check formatting\n        run: cargo fmt --all -- --check\n',
          )
          text = text.replace(
              """      - name: Upload formatted source and lockfile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            Cargo.lock
            Cargo.toml
            src
            tests
""",
              '',
          )
          path.write_text(text)
      - name: Commit normalized source
        run: |
          git rm .github/workflows/normalize-source.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Rust sources and lock dependencies"
          git push origin HEAD:agent/secure-khzip-mvp
