name: Bootstrap khzip v2 PR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/khzip-v2-product
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore reviewed source bundle
        shell: bash
        run: |
          if [ ! -d .bootstrap ]; then
            echo "Source bundle already applied"
            exit 0
          fi
          cat .bootstrap/part-* | base64 --decode > /tmp/khzip-v2.tar.xz
          tar -xJf /tmp/khzip-v2.tar.xz -C .
          cargo fmt --all
          cargo generate-lockfile
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v2.yml
      - name: Commit implementation to PR branch
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement container v2 and product design"
          git push origin HEAD:work/khzip-v2-product
      - name: Initial validation
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
